# Fly config — the API (PRIVATE: no public IP; reached only by the web over Fly 6PN
# at http://cre-api.internal:3001).
#
# ★ TWO volumes, not one — see PERSISTENCE below. `cre_data` holds the SQLite DB and
#   `cre_docs` holds the document bytes + UW corpus. Both must exist BEFORE the first
#   deploy (RUNBOOK §2); creating only cre_data silently loses every uploaded document
#   on the next redeploy.
#
# Deploy from the repo ROOT:  fly deploy --config deploy/fly.api.toml
# ★ app name must be globally unique on Fly — rename if "cre-api" is taken.

app = "cre-api"
primary_region = "iad"   # pick a region near you (iad = US-East). Volume is pinned here.

[build]
  # ★ Path is relative to THIS config file's dir (deploy/), NOT the repo root — so it's
  #   "api.Dockerfile", not "deploy/api.Dockerfile" (the latter resolves to deploy/deploy/…
  #   and fails). The build CONTEXT is still the repo root (where you run `fly deploy`),
  #   which is what the Dockerfile's COPY package.json/apps/packages needs.
  dockerfile = "api.Dockerfile"

[env]
  PORT = "3001"
  # Cap V8's heap BELOW the machine's 2GB so Node GCs hard instead of the kernel
  # OOM-killing the machine (Node's default limit would let the heap grow into the
  # ceiling). ~512MB of headroom is left for native allocations — better-sqlite3,
  # unpdf/exceljs buffers — which live OUTSIDE the V8 heap. Keep this in step with
  # [[vm]] memory below: if you drop to 1gb, drop this to ~768.
  NODE_OPTIONS = "--max-old-space-size=1536 --expose-gc"
  # FRONTEND_URL is the web's public origin (CORS). Set once the web app name is known,
  # e.g. https://cre-web.fly.dev — can also be a Fly secret. JWT_SECRET / ANTHROPIC_API_KEY
  # are SECRETS (fly secrets set), never here.
  FRONTEND_URL = "https://cre-web.fly.dev"

# ─── PERSISTENCE (single volume) ─────────────────────────────────────────────
# ★ Fly Machines allow only ONE volume per machine. `fly config validate` ACCEPTS two
#   [[mounts]], but the machine launcher rejects them ("invalid config.mounts, only 1
#   volume supported") — a deploy-then-fail. So both persistent trees share the ONE
#   cre_docs volume (4GB), mounted at .data (cwd = /app/apps/api):
#
#   • .data/     — the DOCUMENT BYTES + learned corpus, i.e. the volume root itself:
#       - blobs/       content-addressed document bytes (blob-store.ts:67, mkdir -p on write)
#       - source-docs/ historical-UW source files (source-doc-store.service.ts:56)
#       - uploads/     originals kept for re-download
#       - historical-uws.json + learned-rules.json + rule-versions.json — the UW corpus
#                      (uw-intelligence.service.ts:45); the "Loaded 267 historical UWs,
#                      36 learned rules" line at boot
#       - kicks-master-list.json
#   • .data/db/  — the SQLite DB. The image symlinks `data` → `.data/db` (api.Dockerfile),
#                  so the app's UNCHANGED DB_PATH (process.cwd()/data/cre.db,
#                  sqlite-store.ts:29) resolves onto this same volume. .data/db is
#                  mkdir'd at boot.
#
#   The .data persistence guarantee is preserved — .data mounts DIRECTLY at its real path,
#   so documents + corpus survive every redeploy; the DB now rides along in .data/db.
#   An EMPTY volume is safe to boot (missing corpus files → empty Map; dirs mkdir'd at
#   boot) — a working app with 0 UWs until you seed it (RUNBOOK §5–6).
#
#   ★ cre_data (1GB) from the two-volume attempt is now UNUSED — destroy it (RUNBOOK §2)
#     so it isn't billed.
[[mounts]]
  source = "cre_docs"
  destination = "/app/apps/api/.data"

# Internal-only service: internal_port + a health check, but NO [[services.ports]] and
# NO allocated public IP → the api is private (web reaches it via .internal).
#
# ★ NOT scale-to-zero (unlike the web). The api runs a BACKGROUND UNDERWRITE QUEUE
#   (src/index.ts: kickUnderwriteDrain(); on boot it logs "marked N in-flight job(s)
#   INTERRUPTED on boot"). Fly's idle-stop measures INBOUND REQUESTS, and a drain that
#   runs for minutes with no HTTP traffic looks exactly like an idle machine — so
#   auto_stop would kill underwrites mid-flight. The app recovers (jobs are marked
#   INTERRUPTED, not corrupted) but each one needs a MANUAL re-run, and underwriting is
#   the core function. Keeping one machine warm is the cheap fix.
#
# 💵 COST: this makes the api ALWAYS-ON — the one always-billed machine in the stack
#   (the web still scales to zero). To trade that back for the interrupt risk, set
#   auto_stop_machines = "stop" + min_machines_running = 0 and accept that an underwrite
#   started near an idle window may need re-running.
[[services]]
  internal_port = 3001
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # ★ grace_period covers the COLD-BOOT bind delay. The app loads the UW corpus + runs
  #   five boot checks BEFORE app.listen (src/index.ts), and tsx transpiles on first run,
  #   so the port binds ~13s after start (observed). Fly's proxy logs a transient
  #   "app not listening on 0.0.0.0:3001" during that window; grace_period holds the
  #   health check off until the app is actually up. 30s = ~2x the observed boot, headroom
  #   for a busier host. (Long-term app-side fix: bind app.listen BEFORE the corpus load.)
  [[services.http_checks]]
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "30s"

# ★ 2GB, not 512MB. Dev runs this process with --max-old-space-size=8192, and the
#   memory-hungry paths are real: xlsx parsing (exceljs/xlsx), PDF extraction (unpdf/
#   pdfkit), zip unpacking, plus a boot that reads the UW corpus. 512MB would OOM-kill
#   the machine on the first serious ingest. 1GB is probably survivable for read-only
#   demo traffic; 2GB is the safe number for real ingest, which is what this is for.
#
# 💵 COST: shared-cpu-1x at 2GB is roughly 3× the 512MB rate, and with
#   min_machines_running = 1 above it bills continuously. Check current per-GB pricing
#   on Fly's pricing page (`fly platform vm-sizes` lists the shapes) before deploying —
#   drop to 1gb if the always-on cost matters more than ingest headroom.
[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
